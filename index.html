<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuoteFlow</title>
<script src="./msal-browser.min.js" onerror="document.documentElement.dataset.msalError='true'"></script>
<style>
:root{--nav:#10233f;--nav2:#18375f;--bg:#f4f7fb;--card:#fff;--text:#162337;--muted:#68778d;--line:#dce4ef;--blue:#1769e0;--green:#188552;--amber:#a65d00;--red:#b42318;--shadow:0 8px 24px rgba(16,35,63,.08)}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:linear-gradient(180deg,var(--nav),#09182c);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:800;padding:6px 10px 24px}.brand small{display:block;font-size:11px;color:#a9bed8;letter-spacing:.12em;text-transform:uppercase}.nav button{width:100%;border:0;background:transparent;color:#d7e4f3;padding:11px 12px;border-radius:10px;text-align:left;margin:2px 0}.nav button:hover,.nav button.active{background:#23476f;color:#fff}.sidefoot{position:absolute;bottom:18px;left:14px;right:14px}.user{padding:10px;background:#153250;border-radius:10px;font-size:12px}.main{min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:4}.content{padding:26px;max-width:1500px;margin:auto}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:9px;color:var(--text)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red)}.status{padding:7px 10px;border-radius:999px;background:#eaf2ff;color:#1759ae;font-size:12px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.hero h1{margin:0 0 4px;font-size:28px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:14px;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow)}.metric .value{font-size:28px;font-weight:750;margin-top:8px}.metric .label{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.panelhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}table{width:100%;border-collapse:collapse}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #e8edf4;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#f8fafc}tr:hover td{background:#f8fbff}.pill{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}.pill.submitted{background:#eef2f7}.pill.ready{background:#fff4d6;color:#815000}.pill.assigned{background:#e8f2ff;color:#1655a2}.pill.approval{background:#f2eaff;color:#6c35a3}.pill.approved{background:#e4f7ed;color:#176b44}.pill.returned{background:#fde9e7;color:#9d251f}.drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:#fff;z-index:20;box-shadow:-16px 0 40px rgba(0,0,0,.18);overflow:auto}.drawerhead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:18px;display:flex;justify-content:space-between}.drawerbody{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{padding:12px;background:#f7f9fc;border-radius:10px}.field b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}.backdrop{position:fixed;inset:0;background:rgba(7,18,34,.45);z-index:19}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 15%,#2b5b91,var(--nav) 45%,#071323)}.loginbox{width:min(460px,92vw);background:#fff;padding:34px;border-radius:20px;box-shadow:0 30px 70px rgba(0,0,0,.32)}.loginbox h1{margin:0 0 8px}.loginbox .btn{width:100%;margin-top:18px;padding:12px}.notice{padding:12px;border-radius:10px;background:#fff4d6;color:#704900;margin:12px 0}.error{padding:12px;border-radius:10px;background:#fde9e7;color:#8c1d18;white-space:pre-wrap}.config{display:grid;gap:12px}.config label{display:grid;gap:5px;font-weight:600}.config input{padding:10px;border:1px solid var(--line);border-radius:8px}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{height:auto;position:static}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.sidefoot{position:static;margin-top:12px}.cards{grid-template-columns:repeat(2,1fr)}.topbar{position:static}.content{padding:16px}}@media(max-width:560px){.cards,.grid{grid-template-columns:1fr}.hero{display:block}.topbar{padding:0 14px}}
</style>
</head>
<body>
<section id="login" class="login"><div class="loginbox"><h1>QuoteFlow</h1><p class="muted">Corporate quoting workspace powered directly by Microsoft Dataverse.</p><div id="loginError" class="error hidden"></div><div id="setupNotice" class="notice hidden"></div><button id="signIn" class="btn primary">Sign in with your work account</button><button id="showConfig" class="btn">Connection settings</button><div id="config" class="config hidden"><label>Tenant ID<input id="tenant"></label><label>Application / Client ID<input id="client"></label><label>Dataverse URL<input id="dvurl"></label><label>Quote table logical name<input id="quoteTable"></label><button id="saveConfig" class="btn">Save settings</button></div></div></section>
<div id="app" class="shell hidden"><aside class="sidebar"><div class="brand">QuoteFlow<small>Dataverse workspace</small></div><nav class="nav"><button data-page="dashboard" class="active">Dashboard</button><button data-page="queue">Quote queue</button><button data-page="assignments">Assignments</button><button data-page="approvals">Approvals</button><button data-page="settings">Settings</button></nav><div class="sidefoot"><div class="user"><strong id="userName"></strong><br><span id="userEmail"></span></div></div></aside><main class="main"><header class="topbar"><div><strong id="pageTitle">Dashboard</strong></div><div class="toolbar"><span id="syncStatus" class="status">Not synchronized</span><button id="refresh" class="btn">Refresh</button><button id="exportCsv" class="btn">Export CSV</button><button id="signOut" class="btn danger">Sign out</button></div></header><div id="content" class="content"></div></main></div>
<div id="backdrop" class="backdrop hidden"></div><aside id="drawer" class="drawer hidden"><div class="drawerhead"><strong id="drawerTitle">Quote details</strong><button id="closeDrawer" class="btn">Close</button></div><div id="drawerBody" class="drawerbody"></div></aside>
<script>
(() => {
const DEFAULTS={tenantId:'9a7c474b-f702-4ae4-a2f9-b72a1e117401',clientId:'afe649b6-9c70-4b1a-8592-78588284c8ee',dataverseUrl:'https://org23279050.crm.dynamics.com',quoteTable:'cr714_quotelog'};
let cfg={...DEFAULTS,...JSON.parse(localStorage.getItem('qf-config')||'{}')},msalApp,account,token,entitySet,rows=[],page='dashboard';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fields=['cr714_quotelogid','createdon','modifiedon','cr714_recordkey','cr714_asapapprovingmanager','cr714_asapnotes','cr714_assignedto','cr714_attachmentcount','cr714_category','cr714_companyname','cr714_competitor','cr714_completiontime','cr714_customernumber','cr714_customerorlead','cr714_dateassigned','cr714_datequalified','cr714_datereturnedorkilled','cr714_datesentforrevision','cr714_grossprofitpercent','cr714_itemstoquote','cr714_lockedindate','cr714_numberofchanges','cr714_oldquotenumber','cr714_qualifierquoternotes','cr714_quotenumber','cr714_requestnotes','cr714_requestpriority','cr714_revisionnotes','cr714_sentforrevision','cr714_sourcefile','cr714_sourcemodifiedon','cr714_starttime','cr714_submitteremail','cr714_submittername','cr714_submittingagentrole','cr714_totalitemsquoted','cr714_wbsellpricetotal'];
function saveCfg(){cfg={tenantId:$('#tenant').value.trim(),clientId:$('#client').value.trim(),dataverseUrl:$('#dvurl').value.trim().replace(/\/$/,''),quoteTable:$('#quoteTable').value.trim()};localStorage.setItem('qf-config',JSON.stringify(cfg));location.reload()}
function initMsal(){if(!window.msal)throw new Error('Microsoft authentication library could not load. Check the network or content-security settings.');msalApp=new msal.PublicClientApplication({auth:{clientId:cfg.clientId,authority:`https://login.microsoftonline.com/${cfg.tenantId}`,redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage',storeAuthStateInCookie:false}})}
async function acquire(){const request={scopes:[`${cfg.dataverseUrl}/user_impersonation`]};try{return await msalApp.acquireTokenSilent({...request,account})}catch{return msalApp.acquireTokenRedirect(request)}}
async function start(){try{initMsal();const result=await msalApp.handleRedirectPromise();account=result?.account||msalApp.getAllAccounts()[0];if(!account)return;msalApp.setActiveAccount(account);token=(result&&result.accessToken)|| (await acquire()).accessToken;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#userName').textContent=account.name||account.username;$('#userEmail').textContent=account.username;await sync()}catch(e){showError(e)}}
async function signIn(){try{initMsal();await msalApp.loginRedirect({scopes:[`${cfg.dataverseUrl}/user_impersonation`],prompt:'select_account'})}catch(e){showError(e)}}
async function api(url,opts={}){if(!token)token=(await acquire()).accessToken;let r=await fetch(url.startsWith('http')?url:cfg.dataverseUrl+url,{...opts,headers:{Authorization:`Bearer ${token}`,Accept:'application/json','OData-MaxVersion':'4.0','OData-Version':'4.0',Prefer:'odata.include-annotations="*",odata.maxpagesize=5000',...(opts.headers||{})}});if(r.status===401){token=(await acquire()).accessToken;return api(url,opts)}if(!r.ok)throw new Error(`Dataverse ${r.status}: ${(await r.text()).slice(0,800)}`);return r.status===204?{}:r.json()}
async function sync(){try{$('#syncStatus').textContent='Synchronizing…';const meta=await api(`/api/data/v9.2/EntityDefinitions(LogicalName='${cfg.quoteTable}')?$select=EntitySetName`);entitySet=meta.EntitySetName;rows=[];let next=`/api/data/v9.2/${entitySet}?$select=${fields.join(',')}&$orderby=modifiedon desc`;while(next){const d=await api(next);rows.push(...(d.value||[]));next=d['@odata.nextLink']||null}localStorage.setItem('qf-cache',JSON.stringify({at:Date.now(),rows}));$('#syncStatus').textContent=`${rows.length} records`;render()}catch(e){const cache=JSON.parse(localStorage.getItem('qf-cache')||'null');if(cache){rows=cache.rows;$('#syncStatus').textContent=`Offline cache · ${rows.length}`;render()}showError(e)}}
function status(r){if(r.cr714_datereturnedorkilled)return'Returned';if(r.cr714_completiontime)return'Approved';if(String(r.cr714_sentforrevision).toLowerCase()==='true'||r.cr714_datesentforrevision)return'In revision';if(r.cr714_asapapprovingmanager&&r.cr714_assignedto&&r.cr714_datequalified)return'Awaiting approval';if(r.cr714_assignedto||r.cr714_dateassigned)return'Assigned';if(r.cr714_datequalified)return'Ready to assign';return'Submitted'}
function num(v){return Number(v)||0} function money(v){return num(v).toLocaleString('en-US',{style:'currency',currency:'USD'})} function date(v){if(!v)return'';const d=new Date(v);return isNaN(d)?v:d.toLocaleDateString()}
function quoteNo(r){return r.cr714_quotenumber||r.cr714_oldquotenumber||r.cr714_recordkey||'Pending'}
function metrics(){let result={total:rows.length,unassigned:0,approval:0,approved:0,value:0};rows.forEach(r=>{const s=status(r);if(s==='Ready to assign'||s==='Submitted')result.unassigned++;if(s==='Awaiting approval')result.approval++;if(s==='Approved')result.approved++;result.value+=num(r.cr714_wbsellpricetotal)});return result}
function table(list){if(!list.length)return'<div class="empty">No matching Dataverse records.</div>';return `<div class="panel"><div class="panelhead"><strong>${list.length} records</strong></div><div style="overflow:auto"><table><thead><tr><th>Quote</th><th>Customer</th><th>Submitter</th><th>Assigned to</th><th>Status</th><th>Value</th><th>Updated</th></tr></thead><tbody>${list.map(r=>`<tr data-id="${esc(r.cr714_quotelogid)}"><td><button class="btn detail">${esc(quoteNo(r))}</button></td><td><strong>${esc(r.cr714_companyname)}</strong><br><span class="muted">${esc(r.cr714_customernumber)}</span></td><td>${esc(r.cr714_submittername||r.cr714_submitteremail)}</td><td>${esc(r.cr714_assignedto||'Unassigned')}</td><td><span class="pill ${status(r).toLowerCase().replaceAll(' ','-')}">${esc(status(r))}</span></td><td>${money(r.cr714_wbsellpricetotal)}</td><td>${date(r.modifiedon||r.cr714_sourcemodifiedon)}</td></tr>`).join('')}</tbody></table></div></div>`}
function render(){const m=metrics();$('#pageTitle').textContent=({dashboard:'Dashboard',queue:'Quote queue',assignments:'Assignments',approvals:'Approvals',settings:'Settings'})[page];let html='';if(page==='dashboard')html=`<div class="hero"><div><h1>Dashboard</h1><div class="muted">Live Dataverse quote activity</div></div></div><div class="cards"><div class="card metric"><div class="label">Total quotes</div><div class="value">${m.total}</div></div><div class="card metric"><div class="label">Needs assignment</div><div class="value">${m.unassigned}</div></div><div class="card metric"><div class="label">Awaiting approval</div><div class="value">${m.approval}</div></div><div class="card metric"><div class="label">Pipeline value</div><div class="value">${money(m.value)}</div></div></div>${table(rows.slice(0,25))}`;else if(page==='queue')html=`<div class="hero"><div><h1>Quote queue</h1><div class="muted">All synchronized Quote Log records</div></div></div>${table(rows)}`;else if(page==='assignments')html=`<div class="hero"><div><h1>Assignments</h1><div class="muted">Submitted and qualified records that need ownership</div></div></div>${table(rows.filter(r=>['Submitted','Ready to assign','Assigned'].includes(status(r))))}`;else if(page==='approvals')html=`<div class="hero"><div><h1>Approvals</h1><div class="muted">Quote records awaiting or completing approval</div></div></div>${table(rows.filter(r=>['Awaiting approval','Approved','Returned'].includes(status(r))))}`;else html=`<div class="hero"><div><h1>Connection settings</h1><div class="muted">Stored only in this browser.</div></div></div><div class="card config"><label>Tenant ID<input id="sTenant" value="${esc(cfg.tenantId)}"></label><label>Client ID<input id="sClient" value="${esc(cfg.clientId)}"></label><label>Dataverse URL<input id="sUrl" value="${esc(cfg.dataverseUrl)}"></label><label>Quote logical table<input id="sTable" value="${esc(cfg.quoteTable)}"></label><button id="sSave" class="btn primary">Save and reload</button></div>`;$('#content').innerHTML=html;document.querySelectorAll('.detail').forEach(b=>b.onclick=()=>openDetail(b.closest('tr').dataset.id));if($('#sSave'))$('#sSave').onclick=()=>{cfg={tenantId:$('#sTenant').value.trim(),clientId:$('#sClient').value.trim(),dataverseUrl:$('#sUrl').value.trim().replace(/\/$/,''),quoteTable:$('#sTable').value.trim()};localStorage.setItem('qf-config',JSON.stringify(cfg));location.reload()}}
function openDetail(id){const r=rows.find(x=>x.cr714_quotelogid===id);if(!r)return;$('#drawerTitle').textContent=quoteNo(r);$('#drawerBody').innerHTML=`<div class="grid">${[['Company',r.cr714_companyname],['Customer number',r.cr714_customernumber],['Status',status(r)],['Priority',r.cr714_requestpriority],['Submitter',r.cr714_submittername||r.cr714_submitteremail],['Assigned to',r.cr714_assignedto||'Unassigned'],['Quote total',money(r.cr714_wbsellpricetotal)],['Gross profit %',r.cr714_grossprofitpercent],['Items',r.cr714_totalitemsquoted||r.cr714_itemstoquote],['Created',date(r.createdon)],['Updated',date(r.modifiedon)],['Source file',r.cr714_sourcefile]].map(([k,v])=>`<div class="field"><b>${esc(k)}</b>${esc(v??'')}</div>`).join('')}</div><div class="field" style="margin-top:14px"><b>Request notes</b>${esc(r.cr714_requestnotes||'')}</div><div class="field" style="margin-top:14px"><b>Qualifier / quoter notes</b>${esc(r.cr714_qualifierquoternotes||'')}</div><div class="field" style="margin-top:14px"><b>Revision notes</b>${esc(r.cr714_revisionnotes||'')}</div><div class="card" style="margin-top:14px"><strong>Update assignment</strong><p class="muted">Enter a corporate email or the exact value expected by cr714_assignedto.</p><div class="toolbar"><input id="assignee" value="${esc(r.cr714_assignedto||'')}" style="flex:1;padding:10px;border:1px solid var(--line);border-radius:8px"><button id="saveAssignment" class="btn primary">Save to Dataverse</button></div><div id="assignMessage" class="muted"></div></div>`;$('#drawer').classList.remove('hidden');$('#backdrop').classList.remove('hidden');$('#saveAssignment').onclick=()=>assign(r)}
async function assign(r){const value=$('#assignee').value.trim();const msg=$('#assignMessage');try{msg.textContent='Saving…';await api(`/api/data/v9.2/${entitySet}(${r.cr714_quotelogid})`,{method:'PATCH',headers:{'Content-Type':'application/json','If-Match':'*'},body:JSON.stringify({cr714_assignedto:value,cr714_dateassigned:new Date().toISOString()})});r.cr714_assignedto=value;r.cr714_dateassigned=new Date().toISOString();msg.textContent='Saved to Dataverse.';render()}catch(e){msg.textContent=e.message}}
function csvValue(value){const text=String(value??'');return /[",\r\n]/.test(text)?`"${text.replaceAll('"','""')}"`:text}
function exportCsv(){
  const columns=[
    ['Quote Log ID','cr714_quotelogid'],['Quote Number',r=>quoteNo(r)],['Record Key','cr714_recordkey'],
    ['Company','cr714_companyname'],['Customer Number','cr714_customernumber'],['Category','cr714_category'],
    ['Customer or Lead','cr714_customerorlead'],['Priority','cr714_requestpriority'],['Status',r=>status(r)],
    ['Submitter Name','cr714_submittername'],['Submitter Email','cr714_submitteremail'],['Submitting Agent Role','cr714_submittingagentrole'],
    ['Assigned To','cr714_assignedto'],['Date Assigned','cr714_dateassigned'],['Date Qualified','cr714_datequalified'],
    ['Completion Time','cr714_completiontime'],['Returned or Killed','cr714_datereturnedorkilled'],['Sent for Revision','cr714_datesentforrevision'],
    ['Quote Total','cr714_wbsellpricetotal'],['Gross Profit Percent','cr714_grossprofitpercent'],
    ['Items to Quote','cr714_itemstoquote'],['Total Items Quoted','cr714_totalitemsquoted'],['Number of Changes','cr714_numberofchanges'],
    ['Request Notes','cr714_requestnotes'],['Qualifier / Quoter Notes','cr714_qualifierquoternotes'],['Revision Notes','cr714_revisionnotes'],
    ['ASAP Notes','cr714_asapnotes'],['Approving Manager','cr714_asapapprovingmanager'],['Source File','cr714_sourcefile'],
    ['Created On','createdon'],['Modified On','modifiedon'],['Source Modified On','cr714_sourcemodifiedon']
  ];
  const lines=[columns.map(([label])=>csvValue(label)).join(',')];
  for(const row of rows){lines.push(columns.map(([,source])=>csvValue(typeof source==='function'?source(row):row[source])).join(','))}
  const csv='\uFEFF'+lines.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const stamp=new Date().toISOString().replace(/[:.]/g,'-');
  const link=document.createElement('a');
  link.href=url;link.download=`QuoteFlow-QuoteLog-${stamp}.csv`;document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function showError(e){$('#loginError').textContent=e?.message||String(e);$('#loginError').classList.remove('hidden');console.error(e)}
$('#signIn').onclick=signIn;$('#signOut').onclick=()=>msalApp.logoutRedirect({account});$('#refresh').onclick=sync;$('#exportCsv').onclick=exportCsv;$('#closeDrawer').onclick=$('#backdrop').onclick=()=>{$('#drawer').classList.add('hidden');$('#backdrop').classList.add('hidden')};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render()});$('#showConfig').onclick=()=>$('#config').classList.toggle('hidden');$('#saveConfig').onclick=saveCfg;$('#tenant').value=cfg.tenantId;$('#client').value=cfg.clientId;$('#dvurl').value=cfg.dataverseUrl;$('#quoteTable').value=cfg.quoteTable;
if(location.protocol==='file:'){$('#setupNotice').textContent='This app must be served over HTTPS. Publish through GitHub Pages rather than opening index.html directly.';$('#setupNotice').classList.remove('hidden')}start();
})();
</script>
</body></html>
