name: Deploy QuoteFlow to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "quoteflow/index.html"
      - "quoteflow/404.html"
      - "quoteflow/.nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quote-flow-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage the QuoteFlow static site
        shell: bash
        run: |
          set -euo pipefail
          # Only the static SPA is published. quoteflow/ also holds the Node app
          # (server.js, .env, node_modules, SQLite files), which must never be
          # part of a public Pages artifact.
          mkdir -p _site
          cp quoteflow/index.html quoteflow/404.html quoteflow/.nojekyll _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload QuoteFlow Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy QuoteFlow to Pages
        id: deployment
        uses: actions/deploy-pages@v4
